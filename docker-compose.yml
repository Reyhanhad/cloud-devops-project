version: '3.8'

services:
  api:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: devops-api-service
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_USER=devops_user
      - DB_PASSWORD=devops_password
      - DB_NAME=devops_db
    depends_on:
      - postgres-db
    restart: always

  postgres-db:
    image: postgres:16-alpine
    container_name: devops-postgres-db
    environment:
      - POSTGRES_USER=devops_user
      - POSTGRES_PASSWORD=devops_password
      - POSTGRES_DB=devops_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

volumes:
  pgdata: